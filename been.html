<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☕ 一味淨 · 收銀台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
/* ═══════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════ */
:root {
    --cream:   #f7f3ed;
    --parchment: #ede8df;
    --tan:     #d4c4a8;
    --bark:    #8d6e63;
    --espresso:#3d2b1f;
    --roast:   #bc6c25;
    --red:     #a44a3f;
    --green:   #2e7d32;
    --white:   #ffffff;
    --border:  rgba(61,43,31,0.12);
    --shadow:  0 2px 12px rgba(61,43,31,0.10);
    --font:    "Noto Serif TC", "PingFang TC", serif;
    --display: "Playfair Display", "Noto Serif TC", serif;
    --r:       10px;
    --lr-col:  #e6b37e;
    --mr-col:  #bc6c25;
    --dr-col:  #4a3728;
}

/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: var(--font);
    background: var(--cream);
    color: var(--espresso);
    display: flex;
    flex-direction: column;
}

/* ═══════════════════════════════════════════════
   TOP NAV BAR  (always visible)
═══════════════════════════════════════════════ */
.topbar {
    flex-shrink: 0;
    height: 52px;
    background: var(--espresso);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    z-index: 100;
}
.topbar-title {
    font-family: var(--display);
    font-size: 1.05em;
    color: var(--white);
    letter-spacing: 0.04em;
    flex: 1;
}
.topbar-count {
    background: var(--roast);
    color: #fff;
    font-size: 0.72em;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 20px;
}
.topbar-btn {
    height: 32px;
    padding: 0 12px;
    border: none;
    border-radius: 8px;
    font-family: var(--font);
    font-size: 0.75em;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: opacity 0.15s;
    text-decoration: none;
}
.topbar-btn:active { opacity: 0.75; }
.btn-home   { background: rgba(255,255,255,0.14); color: #fff; }
.btn-admin  { background: var(--roast); color: #fff; }
.btn-cart   { background: var(--white); color: var(--espresso); position: relative; display: none; }
.btn-cart .badge {
    position: absolute;
    top: -5px; right: -5px;
    background: var(--red);
    color: #fff;
    width: 16px; height: 16px;
    border-radius: 50%;
    font-size: 0.65em;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
}

/* ═══════════════════════════════════════════════
   TAB BAR  (mobile only)
═══════════════════════════════════════════════ */
.tabbar {
    flex-shrink: 0;
    display: none;
    height: 44px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
}
.tabbar::-webkit-scrollbar { display: none; }
.tabbar-inner {
    display: flex;
    height: 100%;
    min-width: max-content;
}
.tab-pill {
    height: 100%;
    padding: 0 18px;
    display: flex;
    align-items: center;
    font-size: 0.82em;
    font-weight: 700;
    color: var(--bark);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
}
.tab-pill.active { color: var(--espresso); border-bottom-color: var(--roast); }

/* ═══════════════════════════════════════════════
   MAIN LAYOUT
═══════════════════════════════════════════════ */
.app {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
}

/* ── Left panel: menu ── */
.panel-menu {
    width: 230px;
    flex-shrink: 0;
    background: var(--white);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.panel-menu-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--tan) transparent;
    padding: 0 0 24px;
}
.panel-menu-scroll::-webkit-scrollbar { width: 3px; }
.panel-menu-scroll::-webkit-scrollbar-thumb { background: var(--tan); border-radius: 3px; }

/* ── Center panel: beans ── */
.panel-beans {
    flex: 1;
    background: var(--parchment);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
}
.panel-beans-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--tan) transparent;
}
.panel-beans-scroll::-webkit-scrollbar { width: 3px; }
.panel-beans-scroll::-webkit-scrollbar-thumb { background: var(--tan); border-radius: 3px; }

/* ── Right panel: cashier ── */
.panel-cashier {
    width: 280px;
    flex-shrink: 0;
    background: var(--white);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: -4px 0 20px rgba(61,43,31,0.06);
}

/* ═══════════════════════════════════════════════
   SECTION HEADING
═══════════════════════════════════════════════ */
.section-head {
    padding: 14px 14px 8px;
    font-size: 0.65em;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--bark);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
    position: sticky;
    top: 0;
    background: var(--white);
    z-index: 2;
}
.section-head::before {
    content: '';
    width: 3px; height: 12px;
    background: var(--roast);
    border-radius: 2px;
    flex-shrink: 0;
}
.section-head.on-parchment { background: var(--parchment); }

/* ═══════════════════════════════════════════════
   MENU ITEMS LIST
═══════════════════════════════════════════════ */
.menu-list { list-style: none; padding: 0 8px; }
.menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 9px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s, transform 0.1s;
}
.menu-item:hover  { background: var(--cream); }
.menu-item:active { background: var(--parchment); transform: scale(0.99); }
.mi-name  { font-size: 0.85em; font-weight: 600; line-height: 1.3; }
.mi-price { font-size: 0.9em; font-weight: 800; color: var(--red); white-space: nowrap; flex-shrink: 0; }
.mi-price::before { content: '$'; font-size: 0.75em; }
.divider-line {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border), transparent);
    margin: 1px 8px;
}

/* ═══════════════════════════════════════════════
   BEAN GRID
═══════════════════════════════════════════════ */
.bean-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
}
.bean-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 12px 10px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    box-shadow: var(--shadow);
    transition: transform 0.14s, box-shadow 0.14s, border-color 0.14s;
    position: relative;
    text-align: center;
}
.bean-card:hover  { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(61,43,31,0.12); border-color: var(--bark); }
.bean-card:active { transform: scale(0.97); }
.bean-badge {
    font-size: 0.6em;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    align-self: flex-end;
}
.lr { background: var(--lr-col); color: #5a3e2b; }
.mr { background: var(--mr-col); color: #fff; }
.dr { background: var(--dr-col); color: #fff; }
.bean-name {
    font-family: var(--display);
    font-size: 1.05em;
    color: var(--espresso);
    line-height: 1.25;
    margin-top: 2px;
}
.bean-tag {
    font-size: 0.68em;
    color: var(--bark);
}

/* ═══════════════════════════════════════════════
   CASHIER PANEL
═══════════════════════════════════════════════ */
.cashier-head {
    flex-shrink: 0;
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 0.65em;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--bark);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
}
.cashier-head::before {
    content: '';
    width: 3px; height: 12px;
    background: var(--bark);
    border-radius: 2px;
}

.cart-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--tan) transparent;
}
.cart-list::-webkit-scrollbar { width: 3px; }
.cart-list::-webkit-scrollbar-thumb { background: var(--tan); border-radius: 3px; }
.cart-empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--tan);
    gap: 8px;
    font-size: 0.85em;
}
.cart-empty-icon { font-size: 2.2em; }

.cart-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    background: var(--cream);
    border-radius: 8px;
    margin-bottom: 6px;
    border: 1px solid transparent;
    transition: border-color 0.15s;
}
.cart-row:hover { border-color: var(--border); }
.cart-info { flex: 1; min-width: 0; }
.cart-name { font-size: 0.83em; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart-meta { font-size: 0.72em; color: var(--bark); margin-top: 1px; }
.cart-controls { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.qty-btn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--white);
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85em;
    color: var(--espresso);
    transition: background 0.12s;
}
.qty-btn:hover  { background: var(--parchment); }
.qty-btn:active { background: var(--tan); }
.qty-num { font-weight: 700; font-size: 0.85em; min-width: 16px; text-align: center; }
.temp-btn {
    font-size: 0.65em;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--white);
    cursor: pointer;
    color: var(--espresso);
    transition: background 0.12s;
}
.temp-btn:hover { background: var(--parchment); }

/* ── Bill ── */
.cashier-bill {
    flex-shrink: 0;
    padding: 12px 14px 14px;
    border-top: 2px solid var(--parchment);
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.bill-row { display: flex; justify-content: space-between; align-items: center; }
.bill-label { font-size: 0.8em; color: #666; font-weight: 600; }
.bill-total { font-size: 1.5em; font-weight: 800; color: var(--red); }
.bill-change { font-size: 1.5em; font-weight: 800; color: var(--green); }
.cash-input {
    width: 90px;
    padding: 5px 8px;
    border: 1.5px solid var(--bark);
    border-radius: 6px;
    font-size: 1em;
    font-weight: 700;
    text-align: right;
    color: var(--espresso);
    font-family: var(--font);
    background: #fdfaf6;
}
.cash-input:focus { outline: none; border-color: var(--roast); box-shadow: 0 0 0 2px rgba(188,108,37,0.15); }
.quick-cash { display: flex; gap: 4px; justify-content: flex-end; }
.qc-btn {
    padding: 3px 7px;
    background: var(--parchment);
    border: none; border-radius: 4px;
    font-size: 0.72em; font-weight: 700;
    cursor: pointer; color: var(--espresso);
    transition: background 0.12s;
}
.qc-btn:hover { background: var(--tan); }
.dashed { border: none; border-top: 1px dashed var(--border); }
.clear-btn {
    padding: 9px;
    background: var(--parchment);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.8em; font-weight: 700;
    color: #888;
    cursor: pointer;
    font-family: var(--font);
    transition: background 0.12s;
    width: 100%;
}
.clear-btn:hover { background: var(--tan); color: var(--espresso); }

/* ═══════════════════════════════════════════════
   SPEC BOTTOM SHEET
═══════════════════════════════════════════════ */
.overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 500;
    align-items: flex-end;
    justify-content: center;
}
.overlay.open { display: flex; }
.spec-sheet {
    background: var(--white);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 20px 20px 40px;
    box-shadow: 0 -8px 40px rgba(61,43,31,0.18);
    animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.spec-name { font-family: var(--display); font-size: 1.2em; font-weight: 600; color: var(--espresso); margin-bottom: 2px; }
.spec-sub  { font-size: 0.78em; color: var(--bark); margin-bottom: 16px; }
.spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.spec-btn {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 14px;
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-family: var(--font);
    transition: background 0.12s, border-color 0.12s, transform 0.1s;
}
.spec-btn:hover  { background: var(--parchment); border-color: var(--bark); }
.spec-btn:active { transform: scale(0.97); }
.spec-label { font-weight: 700; font-size: 0.9em; }
.spec-price { font-weight: 800; color: var(--red); font-size: 1em; }
.spec-price::before { content: '$'; font-size: 0.78em; }
.spec-cancel {
    width: 100%; margin-top: 12px;
    padding: 11px; background: var(--parchment);
    border: none; border-radius: 10px;
    font-size: 0.88em; font-weight: 700; color: #888;
    cursor: pointer; font-family: var(--font);
}
.spec-cancel:hover { background: var(--tan); }

/* ═══════════════════════════════════════════════
   ADMIN MODAL
═══════════════════════════════════════════════ */
.admin-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 600;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
.admin-overlay.open { display: flex; }
.admin-panel {
    background: var(--white);
    border-radius: 14px;
    width: 100%; max-width: 520px;
    max-height: 88dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(61,43,31,0.2);
}
.admin-header {
    background: var(--espresso);
    color: #fff; padding: 14px 18px;
    font-weight: 700; font-size: 0.92em;
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
}
.admin-close {
    background: rgba(255,255,255,0.15);
    border: none; color: #fff;
    width: 28px; height: 28px;
    border-radius: 50%; cursor: pointer;
    font-size: 1em; display: flex; align-items: center; justify-content: center;
}
.admin-close:hover { background: rgba(255,255,255,0.25); }
.admin-tabs { display: flex; background: var(--parchment); flex-shrink: 0; border-bottom: 1px solid var(--border); }
.admin-tab {
    flex: 1; padding: 10px; text-align: center;
    font-size: 0.8em; font-weight: 700;
    cursor: pointer; color: var(--bark);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
}
.admin-tab.active { color: var(--espresso); border-bottom-color: var(--roast); background: var(--white); }
.admin-body { flex: 1; overflow-y: auto; padding: 16px; }
.status-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); margin-bottom: 8px;
    background: var(--white);
}
.si-name { font-weight: 600; font-size: 0.87em; }
.si-sub  { font-size: 0.74em; color: var(--bark); margin-top: 1px; }
.toggle { position: relative; width: 42px; height: 22px; flex-shrink: 0; }
.toggle input { display: none; }
.toggle-slider {
    position: absolute; inset: 0;
    background: #ccc; border-radius: 22px;
    cursor: pointer; transition: background 0.2s;
}
.toggle-slider::before {
    content: '';
    position: absolute; left: 3px; top: 3px;
    width: 16px; height: 16px;
    background: #fff; border-radius: 50%;
    transition: transform 0.2s;
}
.toggle input:checked + .toggle-slider { background: var(--roast); }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); }
.batch-row { display: flex; gap: 8px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.batch-btn {
    flex: 1; padding: 9px; border: none; border-radius: 8px;
    font-weight: 700; font-size: 0.82em; cursor: pointer;
    font-family: var(--font); transition: opacity 0.15s;
}
.batch-btn:hover { opacity: 0.85; }
.add-form { display: flex; flex-direction: column; gap: 10px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1/-1; }
.form-label { font-size: 0.74em; font-weight: 700; color: var(--bark); }
.form-input, .form-select {
    padding: 7px 10px;
    border: 1.5px solid #e0d8d0;
    border-radius: 7px;
    font-family: var(--font); font-size: 0.85em;
    color: var(--espresso); background: #fdfaf6;
    transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus { outline: none; border-color: var(--roast); }
.submit-btn {
    background: var(--roast); color: #fff;
    border: none; padding: 10px; border-radius: 8px;
    font-weight: 700; font-size: 0.9em;
    cursor: pointer; font-family: var(--font);
    transition: background 0.15s; margin-top: 4px;
}
.submit-btn:hover { background: var(--espresso); }
.form-note {
    font-size: 0.74em; color: #999;
    background: #fdf8f1; padding: 8px 10px;
    border-radius: 6px; border-left: 3px solid var(--lr-col);
    line-height: 1.6;
}
.success-msg {
    display: none; background: #e8f5e9; color: var(--green);
    padding: 10px 12px; border-radius: 8px;
    font-size: 0.82em; font-weight: 600; text-align: center;
}

/* ═══════════════════════════════════════════════
   MOBILE CART DRAWER
═══════════════════════════════════════════════ */
.cart-drawer-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 400;
}
.cart-drawer-overlay.open { display: block; }
.cart-drawer {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: min(86vw, 320px);
    background: var(--white);
    box-shadow: -6px 0 30px rgba(61,43,31,0.15);
    display: flex; flex-direction: column;
    z-index: 401;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
}
.cart-drawer-overlay.open .cart-drawer { transform: translateX(0); }

/* ═══════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════ */

/* TABLET: 481–900 */
@media (max-width: 900px) {
    .panel-cashier { display: none; }
    .btn-cart { display: flex !important; }
}

/* MOBILE: ≤ 480 */
@media (max-width: 480px) {
    .topbar { height: 48px; padding: 0 10px; gap: 6px; }
    .topbar-title { font-size: 0.92em; }
    .tabbar { display: flex; }
    .panel-menu { display: none; }
    .panel-beans { display: none; }
    .panel-beans.tab-active,
    .panel-menu.tab-active { display: flex; }
    .section-head { padding: 12px 12px 6px; }
    .bean-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .spec-sheet { padding: 18px 16px 36px; }
}

/* DESKTOP: ≥ 901 */
@media (min-width: 901px) {
    .panel-cashier { display: flex; }
    .btn-cart { display: none !important; }
}

/* LARGE DESKTOP */
@media (min-width: 1280px) {
    .panel-menu { width: 260px; }
    .panel-cashier { width: 300px; }
    .bean-grid { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
}
    </style>
</head>
<body>

<!-- ═══ TOP NAV ═══ -->
<header class="topbar">
    <span class="topbar-title">☕ 一味淨 · 收銀台</span>
    <span class="topbar-count" id="topbarCount">0 品項</span>

<script>
// ══════════════════════════════════════
// CONFIG
// ══════════════════════════════════════
const MENU_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEiSHdIF1FlVgrSp5r8DhCDnTKAVhfRjXPIizNQ_d5kK_FFUQJfQKhQG1YXe3ViIdExAiUnAPlKCO-/pub?gid=250388087&single=true&output=csv";
const GAS_URL = "https://script.google.com/macros/s/AKfycbyAXTwhXOZfmICm1QjOd0tq5qJKYH0rMql4dWc_1SxlCkBmF8nD-1NEDrHLKzzLo481lQ/exec";

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let coffeeData = [];
let cart = {};
let currentAdminTab = 'status';
let currentMobileTab = 'classic'; // 'classic' | 'other' | 'beans'

// ══════════════════════════════════════
// CSV PARSER
// ══════════════════════════════════════
function parseCSV(text) {
    const rows = [];
    for (const line of text.split(/\r?\n/)) {
        if (!line.trim()) continue;
        const row = []; let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
            else if (c === ',' && !inQ) { row.push(cur.trim()); cur = ''; }
            else cur += c;
        }
        row.push(cur.trim()); rows.push(row);
    }
    return rows;
}

// ══════════════════════════════════════
// FETCH
// ══════════════════════════════════════
async function fetchMenuData() {
    try {
        const res = await fetch(MENU_CSV_URL + '&t=' + Date.now());
        if (!res.ok) throw new Error();
        const rows = parseCSV(await res.text());
        coffeeData = [];
        for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r[0]) continue;
            const type = r[0].trim(), name = (r[2]||'').trim();
            if (!name) continue;
            if (type === 'classic') {
                coffeeData.push({ type, name, price: parseInt(r[8])||0 });
            } else if (type === 'other') {
                coffeeData.push({ type, name, price: parseInt(r[8])||0 });
            } else if (type === 'single') {
                const status = (r[12]||'').trim();
                coffeeData.push({
                    id: parseInt(r[1])||i, type, name,
                    origin: (r[3]||'').trim(), process: (r[4]||'').trim(),
                    roast:  (r[5]||'lr').trim(), roastName:(r[6]||'淺焙').trim(),
                    flavor: (r[7]||'').trim(),
                    take:  parseInt(r[8])||0, stay: parseInt(r[9])||0,
                    pound: parseInt(r[10])||0, drip: parseInt(r[11])||0,
                    available: status === '1' || status === '上架'
                });
            }
        }
        render();
    } catch {
        document.getElementById('beanGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#a44a3f;font-size:0.85em;">⚠️ 讀取失敗，請重新整理</div>';
    }
}

// ══════════════════════════════════════
// RENDER MENU
// ══════════════════════════════════════
function esc(s) { return s.replace(/'/g,"\\'"); }

function render() {
    // Classic list
    document.getElementById('classicList').innerHTML = coffeeData
        .filter(d => d.type === 'classic')
        .map((item, i, arr) => `
            <li class="menu-item" onclick="addToCart('${esc(item.name)}',${item.price},'義式')">
                <span class="mi-name">${item.name}</span>
                <span class="mi-price">${item.price}</span>
            </li>${i < arr.length-1 ? '<div class="divider-line"></div>' : ''}
        `).join('');

    // Other list
    document.getElementById('otherList').innerHTML = coffeeData
        .filter(d => d.type === 'other')
        .map((item, i, arr) => `
            <li class="menu-item" onclick="addToCart('${esc(item.name)}',${item.price},'其他')">
                <span class="mi-name">${item.name}</span>
                <span class="mi-price">${item.price}</span>
            </li>${i < arr.length-1 ? '<div class="divider-line"></div>' : ''}
        `).join('');

    // Bean grid
    const singles = coffeeData.filter(d => d.type === 'single' && d.available);
    document.getElementById('beanGrid').innerHTML = singles.length === 0
        ? '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#bbb;font-size:0.85em;">目前無供應單品豆</div>'
        : singles.map(item => `
            <div class="bean-card" onclick="openSpecSheet(${item.id})">
                <span class="bean-badge ${item.roast}">${item.roastName}</span>
                <div class="bean-name">${item.name}</div>
                ${item.origin ? `<div class="bean-tag">${item.origin}</div>` : ''}
            </div>
        `).join('');
}

// ══════════════════════════════════════
// SPEC SHEET
// ══════════════════════════════════════
function openSpecSheet(id) {
    const item = coffeeData.find(c => c.id === id);
    if (!item) return;
    document.getElementById('specName').textContent = '🫘 ' + item.name;
    document.getElementById('specSub').textContent  = [item.roastName, item.origin, item.process].filter(Boolean).join(' · ');
    const specs = [
        { label:'外帶', price:item.take },
        { label:'內用', price:item.stay },
        { label:'濾掛', price:item.drip },
        { label:'半磅', price:item.pound }
    ].filter(s => s.price > 0);
    document.getElementById('specGrid').innerHTML = specs.map(s => `
        <button class="spec-btn" onclick="addToCart('${esc(item.name)}',${s.price},'${s.label}');closeSpecSheet();">
            <span class="spec-label">${s.label}</span>
            <span class="spec-price">${s.price}</span>
        </button>
    `).join('');
    document.getElementById('specOverlay').classList.add('open');
}
function closeSpecSheet() { document.getElementById('specOverlay').classList.remove('open'); }
function handleSpecOverlayClick(e) { if (e.target === document.getElementById('specOverlay')) closeSpecSheet(); }

// ══════════════════════════════════════
// CART
// ══════════════════════════════════════
function addToCart(name, price, subText) {
    cart[`${name}-${subText}-${Date.now()}`] = { name, subText, price, qty:1, temp:'冰' };
    updateCartUI();
}
function toggleTemp(k)   { if (cart[k]) { cart[k].temp = cart[k].temp==='冰'?'熱':'冰'; updateCartUI(); } }
function changeQty(k, d) { if (!cart[k]) return; cart[k].qty += d; if (cart[k].qty <= 0) delete cart[k]; updateCartUI(); }
function clearCart()     { cart = {}; document.getElementById('cashReceived').value=''; document.getElementById('drawerCash').value=''; updateCartUI(); }
function setFastCash(n)  {
    document.getElementById('cashReceived').value = n;
    document.getElementById('drawerCash').value = n;
    calculateChange();
}

function calculateChange() {
    const total = Object.values(cart).reduce((s,i) => s + i.price * i.qty, 0);
    const desk  = parseInt(document.getElementById('cashReceived').value) || 0;
    const draw  = parseInt(document.getElementById('drawerCash').value)   || 0;
    const cash  = desk || draw;
    const change = cash >= total ? cash - total : 0;
    document.getElementById('calcChange').textContent   = change;
    document.getElementById('drawerChange').textContent = change;
}

function buildCartHTML(listId) {
    const keys = Object.keys(cart);
    if (keys.length === 0) {
        document.getElementById(listId).innerHTML = '<div class="cart-empty"><div class="cart-empty-icon">🛒</div><span>收銀台空空如也</span></div>';
        return;
    }
    document.getElementById(listId).innerHTML = keys.map(k => {
        const item = cart[k];
        const showTemp = item.subText === '內用' || item.subText === '外帶';
        return `
            <div class="cart-row">
                <div class="cart-info">
                    <div class="cart-name">${item.name}</div>
                    <div class="cart-meta">${item.subText}${showTemp ? ' · ' + item.temp : ''} &nbsp;·&nbsp; $${item.price}</div>
                </div>
                <div class="cart-controls">
                    ${showTemp ? `<button class="temp-btn" onclick="toggleTemp('${k}')">${item.temp}</button>` : ''}
                    <button class="qty-btn" onclick="changeQty('${k}',-1)">−</button>
                    <span class="qty-num">${item.qty}</span>
                    <button class="qty-btn" onclick="changeQty('${k}',1)">+</button>
                </div>
            </div>`;
    }).join('');
}

function updateCartUI() {
    const keys  = Object.keys(cart);
    const total = Object.values(cart).reduce((s,i) => s + i.price * i.qty, 0);
    const count = Object.values(cart).reduce((s,i) => s + i.qty, 0);

    document.getElementById('topbarCount').textContent = count + ' 品項';
    document.getElementById('calcTotal').textContent   = total;
    document.getElementById('drawerTotal').textContent = total;
    document.getElementById('cartBadge').textContent   = count;
    document.getElementById('cartBadge').style.display = count > 0 ? 'flex' : 'none';

    buildCartHTML('cartList');
    buildCartHTML('drawerCartList');
    calculateChange();
}

// ══════════════════════════════════════
// CART DRAWER (mobile/tablet)
// ══════════════════════════════════════
function openCartDrawer()  { document.getElementById('cartDrawerOverlay').classList.add('open'); }
function closeCartDrawer() { document.getElementById('cartDrawerOverlay').classList.remove('open'); }
function handleCartOverlayClick(e) {
    if (e.target === document.getElementById('cartDrawerOverlay')) closeCartDrawer();
}

// ══════════════════════════════════════
// MOBILE TABS
// ══════════════════════════════════════
function switchTab(tab) {
    currentMobileTab = tab;
    ['classic','other','beans'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    });
    const panelMenu  = document.getElementById('panel-menu');
    const panelBeans = document.getElementById('panel-beans');

    if (tab === 'beans') {
        panelMenu.classList.remove('tab-active');
        panelBeans.classList.add('tab-active');
    } else {
        panelBeans.classList.remove('tab-active');
        panelMenu.classList.add('tab-active');
        // scroll to right section
        setTimeout(() => {
            const head = document.getElementById(tab === 'classic' ? 'classicList' : 'otherList');
            if (head) head.closest('.panel-menu-scroll')?.scrollTo({ top: head.previousElementSibling?.offsetTop || 0, behavior: 'smooth' });
        }, 50);
    }
}

// ══════════════════════════════════════
// ADMIN
// ══════════════════════════════════════
function openAdminPanel()  { document.getElementById('adminOverlay').classList.add('open'); renderAdminTab(); }
function closeAdminPanel() { document.getElementById('adminOverlay').classList.remove('open'); }
function handleAdminOverlayClick(e) { if (e.target === document.getElementById('adminOverlay')) closeAdminPanel(); }
function switchAdminTab(tab) {
    currentAdminTab = tab;
    document.getElementById('tabStatus').classList.toggle('active', tab === 'status');
    document.getElementById('tabAdd').classList.toggle('active', tab === 'add');
    renderAdminTab();
}

function renderAdminTab() {
    const body = document.getElementById('adminBody');
    if (currentAdminTab === 'status') {
        const singles = coffeeData.filter(c => c.type === 'single');
        if (!singles.length) { body.innerHTML = '<div style="text-align:center;color:#bbb;padding:30px;">尚無單品豆資料</div>'; return; }
        body.innerHTML = `
            <div class="batch-row">
                <button class="batch-btn" style="background:#4a3728;color:#fff;" onclick="batchUpdate(true)">✅ 全數上架</button>
                <button class="batch-btn" style="background:#bbb;color:#fff;" onclick="batchUpdate(false)">❌ 全數下架</button>
            </div>
            ${singles.map(item => `
                <div class="status-item">
                    <div><div class="si-name">${item.name}</div><div class="si-sub">${item.origin} · ${item.roastName}</div></div>
                    <label class="toggle">
                        <input type="checkbox" id="tog_${item.id}" ${item.available?'checked':''} onchange="toggleStatus(${item.id},this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </div>`).join('')}`;
    } else {
        body.innerHTML = `
            <div class="form-note" style="margin-bottom:12px;">填寫後點「新增」，自動寫入試算表並設為上架。</div>
            <div class="success-msg" id="addSuccessMsg">✅ 已寫入試算表！</div>
            <div class="add-form">
                <div class="form-group full"><label class="form-label">豆子名稱 *</label><input class="form-input" id="f_name" placeholder="例：肯亞 AA 日曬" type="text"></div>
                <div class="form-grid-2">
                    <div class="form-group"><label class="form-label">產地</label><input class="form-input" id="f_origin" placeholder="例：肯亞" type="text"></div>
                    <div class="form-group"><label class="form-label">處理法</label><input class="form-input" id="f_process" placeholder="例：日曬" type="text"></div>
                    <div class="form-group"><label class="form-label">烘焙度</label>
                        <select class="form-select" id="f_roast"><option value="lr">淺焙</option><option value="mr">中焙</option><option value="dr">深焙</option></select>
                    </div>
                    <div class="form-group"><label class="form-label">風味描述</label><input class="form-input" id="f_flavor" placeholder="例：藍莓、甜感" type="text"></div>
                </div>
                <div class="form-label" style="margin-top:2px;">價格設定</div>
                <div class="form-grid-2">
                    <div class="form-group"><label class="form-label">外帶 $</label><input class="form-input" id="f_take" type="number" placeholder="150" inputmode="numeric"></div>
                    <div class="form-group"><label class="form-label">內用 $</label><input class="form-input" id="f_stay" type="number" placeholder="160" inputmode="numeric"></div>
                    <div class="form-group"><label class="form-label">半磅 $</label><input class="form-input" id="f_pound" type="number" placeholder="350" inputmode="numeric"></div>
                    <div class="form-group"><label class="form-label">濾掛 $</label><input class="form-input" id="f_drip" type="number" placeholder="80" inputmode="numeric"></div>
                </div>
                <button class="submit-btn" onclick="submitNewBean()">＋ 新增單品豆</button>
            </div>`;
    }
}

async function callGAS(payload) {
    const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload) });
    return res.json();
}

async function toggleStatus(id, checked) {
    const item = coffeeData.find(c => c.id === id);
    if (!item) return;
    item.available = checked; render();
    const cb = document.getElementById('tog_' + id);
    if (cb) cb.disabled = true;
    try {
        const r = await callGAS({ action:'updateStatus', id, status:checked });
        if (!r.ok) throw new Error();
    } catch {
        alert('⚠️ 試算表同步失敗，請確認網路或 Apps Script 設定。');
        item.available = !checked; render();
    } finally {
        if (cb) cb.disabled = false;
    }
}

async function batchUpdate(status) {
    coffeeData.filter(c => c.type==='single').forEach(c => c.available = status);
    render(); renderAdminTab();
    try { await callGAS({ action:'batchUpdateStatus', status }); }
    catch { alert('⚠️ 批次同步失敗。'); }
}

async function submitNewBean() {
    const name = document.getElementById('f_name').value.trim();
    if (!name) { alert('請填寫豆子名稱'); return; }
    const rv = document.getElementById('f_roast').value;
    const bean = {
        name, origin:document.getElementById('f_origin').value.trim(),
        process:document.getElementById('f_process').value.trim(),
        roast:rv, roastName:{lr:'淺焙',mr:'中焙',dr:'深焙'}[rv],
        flavor:document.getElementById('f_flavor').value.trim(),
        take:parseInt(document.getElementById('f_take').value)||0,
        stay:parseInt(document.getElementById('f_stay').value)||0,
        pound:parseInt(document.getElementById('f_pound').value)||0,
        drip:parseInt(document.getElementById('f_drip').value)||0,
    };
    const btn = document.querySelector('.submit-btn');
    btn.textContent = '⏳ 寫入中…'; btn.disabled = true;
    try {
        const r = await callGAS({ action:'addBean', bean });
        coffeeData.push({ ...bean, id:r.newId, type:'single', available:true });
        render();
        const msg = document.getElementById('addSuccessMsg');
        if (msg) { msg.style.display='block'; setTimeout(()=>msg.style.display='none', 3000); }
        ['f_name','f_origin','f_process','f_flavor','f_take','f_stay','f_pound','f_drip'].forEach(id=>document.getElementById(id).value='');
        setTimeout(()=>switchAdminTab('status'), 1200);
    } catch { alert('⚠️ 寫入失敗，請確認網路或 Apps Script 設定。'); }
    finally { btn.textContent='＋ 新增單品豆'; btn.disabled=false; }
}

updateCartUI();
</script>
