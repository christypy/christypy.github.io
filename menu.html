<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>菜單</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c1e15;
            --secondary: #8c6a5c;
            --accent: #b85a4b;
            --bg: #f9f6f0;
            --card-bg: #ffffff;
            --border: rgba(44, 30, 21, 0.08);
            
            /* 烘焙度色彩 */
            --lr: #e3b074;
            --mr: #a9703c;
            --dr: #543d2b;
            
            --font-main: "Noto Serif TC", serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333;
            margin: 0;
            font-family: var(--font-main);
            min-height: 100vh;
            padding: 12px 16px 30px 16px; /* 🚀 縮減頂部內距 */
            padding-bottom: 90px; /* 留出底部導覽列空間 */
            line-height: 1.6;
        }

        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
        }

        /* ☕ 標頭設計（已縮減內外距與高度） */
        .header {
            text-align: center;
            margin: 12px 0 20px; /* 🚀 大幅縮減與上下內容的間距 */
        }
        .header h1 {
            font-size: 1.6em; /* 稍微縮小更精緻 */
            color: var(--primary);
            margin: 0;
            letter-spacing: 4px;
        }
        .header::after {
            content: '';
            display: block;
            width: 30px;
            height: 2px;
            background: var(--secondary);
            margin: 8px auto 0;
            opacity: 0.5;
        }

        /* 📱 底部現代感分段導覽列 */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(44, 30, 21, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: calc(100% - 32px);
            max-width: 480px;
        }
        
        .nav-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            padding: 10px 4px;
            font-size: 0.85em;
            font-family: var(--font-main);
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.2s ease;
            border-radius: 30px;
        }
        
        .nav-btn:active, .nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .nav-btn.home-spec {
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }

        /* 統一的區塊大標題 */
        .section-title {
            font-size: 1.15em;
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 12px 0; /* 🚀 縮減標題下方間距 */
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 縮減滾動定位與區塊頂部的間距 */
        .scroll-section {
            scroll-margin-top: 15px;
            margin-top: 20px; /* 🚀 大幅縮減區塊彼此間的空隙 */
        }

        /* 📌 響應式排版架構 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px; /* 🚀 縮減排版欄位間隙 */
        }

        @media (min-width: 992px) {
            .main-layout {
                grid-template-columns: 38% 62%; 
                gap: 32px;
            }
        }

        /* 📌 篩選器樣式設計 */
        .filter-container {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 14px; /* 🚀 縮減篩選器下方的空白 */
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(44,30,21,0.01);
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-label {
            font-size: 0.8em;
            font-weight: 700;
            color: var(--secondary);
            min-width: 45px;
        }
        .filter-btn {
            background: #f4f0ea;
            border: 1px solid transparent;
            color: #555;
            padding: 3px 10px;
            font-size: 0.78em;
            font-family: var(--font-main);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn:hover {
            background: #ebe4da;
        }
        .filter-btn.active {
            background: var(--primary);
            color: #fff;
            font-weight: 700;
        }

        /* 📌 經典飲品排版 */
        .menu-list-classic {
            display: flex;
            flex-direction: column;
            gap: 12px; /* 🚀 稍微縮減飲品行距，畫面更緊湊 */
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(44,30,21,0.02);
            border: 1px solid var(--border);
        }

        .menu-item { 
            display: flex; 
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
        }
        .item-name { 
            font-weight: 500; 
            color: var(--primary); 
            font-size: 0.95em; 
        }
        .item-line {
            flex-grow: 1;
            border-bottom: 1px dotted rgba(44, 30, 21, 0.2);
            margin-bottom: 5px;
        }
        .item-price { 
            font-weight: 700; 
            color: var(--accent); 
            font-size: 1em; 
            font-family: 'Playfair Display', serif;
        }
        .item-price::before { content: '$'; font-size: 0.9em; margin-right: 1px; }

        /* 📌 單品豆網格 */
        .single-grid { 
            display: grid;
            grid-template-columns: 1fr; 
            gap: 14px; /* 🚀 縮減卡片與卡片間的空隙 */
        }
        @media (min-width: 576px) {
            .single-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* 單品豆精緻卡片 */
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            padding: 16px; /* 🚀 縮減內距，讓手機螢幕能看見更多卡片 */
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 4px 16px rgba(44,30,21,0.02);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .card.hidden {
            display: none !important;
        }

        .badge-row {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .badge {
            font-size: 0.75em; 
            padding: 2px 7px; 
            color: #fff; 
            font-weight: 700; 
            border-radius: 4px;
        }
        .badge.lr { background: var(--lr); color: #4a2e10 !important; }
        .badge.mr { background: var(--mr); }
        .badge.dr { background: var(--dr); }
        
        .badge.process { 
            background: #fcf4ec; 
            color: #a06d44; 
            border: 1px solid rgba(160,109,68,0.15);
        }

        .theme-word { 
            font-size: 1.2em; 
            font-weight: 700;
            color: var(--primary); 
            margin: 0 0 2px 0; 
            line-height: 1.3;
        }
        .origin { 
            font-size: 0.82em; 
            color: var(--secondary); 
            margin-bottom: 10px;
        }

        .flavor { 
            font-size: 0.88em; 
            color: #555; 
            margin: 0 0 12px 0; 
            flex-grow: 1; 
            line-height: 1.4;
            padding: 8px 10px;
            background: #faf8f5;
            border-radius: 6px;
            border-left: 2px solid rgba(140, 106, 92, 0.2);
        }

        /* 📌 價格矩陣 */
        .price-matrix { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 6px; 
            border-top: 1px dashed var(--border); 
            padding-top: 10px; 
        }
        .price-box { 
            background: #fff;
            border: 1px solid rgba(44, 30, 21, 0.04);
            padding: 5px 8px; 
            border-radius: 6px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .p-label { font-size: 0.78em; color: #777; }
        .p-amount { 
            font-weight: 700; 
            color: var(--accent); 
            font-size: 0.9em; 
            font-family: 'Playfair Display', serif;
        }
        .p-amount::before { content: '$'; font-size: 0.85em; margin-right: 1px; }

        .loading-text { text-align: center; color: #999; padding: 20px; font-size: 0.9em; }
        .no-match-text { text-align: center; color: #aaa; padding: 30px 10px; font-size: 0.9em; grid-column: 1 / -1; }
        
        /* 📌 底部次要區塊 */
        .bottom-layout {
            margin-top: 24px; /* 🚀 縮減頂部空隙 */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>菜單</h1>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn home-spec" onclick="window.location.href='/'">首頁</button>

        <!-- <button class="nav-btn home-spec" onclick="window.location.href='https://christypy.github.io/'">🏠 首頁</button> -->
        <button class="nav-btn" onclick="scrollToSection('classic-sec')">經典飲品</button>
        <button class="nav-btn" onclick="scrollToSection('single-sec')">單品豆</button>
        <button class="nav-btn" onclick="scrollToSection('other-sec')">其他品項</button>
    </div>

    <div class="main-layout">
        
        <div id="classic-sec" class="drinks-column scroll-section">
            <div class="section-title">經典飲品</div>
            <div class="menu-list-classic" id="classicList">
                <div class="loading-text">讀取中…</div>
            </div>
        </div>

        <div id="single-sec" class="single-column scroll-section">
            <div class="section-title">單品咖啡豆</div>
            
            <div class="filter-container">
                <div class="filter-group">
                    <span class="filter-label">烘焙度</span>
                    <button class="filter-btn active" data-type="roast" data-val="all">全部</button>
                    <button class="filter-btn" data-type="roast" data-val="lr">淺焙</button>
                    <button class="filter-btn" data-type="roast" data-val="mr">中焙</button>
                    <button class="filter-btn" data-type="roast" data-val="dr">深焙</button>
                </div>
                <div class="filter-group">
                    <span class="filter-label">處理法</span>
                    <button class="filter-btn active" data-type="process" data-val="all">全部</button>
                    <button class="filter-btn" data-type="process" data-val="washed">水洗</button>
                    <button class="filter-btn" data-type="process" data-val="natural">日曬</button>
                    <button class="filter-btn" data-type="process" data-val="honey">蜜處理/其他</button>
                </div>
            </div>

            <div class="single-grid" id="singleGrid">
                <div class="loading-text">☕ 讀取單品豆中…</div>
            </div>
        </div>

    </div>

    <div id="other-sec" class="bottom-layout scroll-section">
        <div class="section-title">其他品項</div>
        <div class="menu-list-classic" id="otherList">
            <div class="loading-text">讀取中…</div>
        </div>
    </div>
</div>

<script>
const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEiSHdIF1FlVgrSp5r8DhCDnTKAVhfRjXPIizNQ_d5kK_FFUQJfQKhQG1YXe3ViIdExAiUnAPlKCO-/pub?gid=250388087&single=true&output=csv";

let currentRoastFilter = 'all';
let currentProcessFilter = 'all';

function scrollToSection(id) {
    const element = document.getElementById(id);
    if (element) {
        element.scrollIntoView({ behavior: 'smooth' });
    }
}

function parseCSV(text) {
    const rows = [];
    const lines = text.split(/\r?\n/);
    for (const line of lines) {
        if (!line.trim()) continue;
        const row = [];
        let current = '';
        let inQuote = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
                if (inQuote && line[i+1] === '"') { current += '"'; i++; }
                else inQuote = !inQuote;
            } else if (ch === ',' && !inQuote) {
                row.push(current.trim());
                current = '';
            } else {
                current += ch;
            }
        }
        row.push(current.trim());
        rows.push(row);
    }
    return rows;
}

function applyFilters() {
    const cards = document.querySelectorAll('#singleGrid .card');
    let visibleCount = 0;

    cards.forEach(card => {
        const roast = card.getAttribute('data-roast');
        const processStr = card.getAttribute('data-process');

        const matchRoast = (currentRoastFilter === 'all' || roast === currentRoastFilter);

        let matchProcess = false;
        if (currentProcessFilter === 'all') {
            matchProcess = true;
        } else if (currentProcessFilter === 'washed') {
            matchProcess = processStr.includes('水洗');
        } else if (currentProcessFilter === 'natural') {
            matchProcess = processStr.includes('日曬');
        } else if (currentProcessFilter === 'honey') {
            matchProcess = !processStr.includes('水洗') && !processStr.includes('日曬');
        }

        if (matchRoast && matchProcess) {
            card.classList.remove('hidden');
            visibleCount++;
        } else {
            card.classList.add('hidden');
        }
    });

    const existingNoMatch = document.getElementById('no-match-msg');
    if (visibleCount === 0) {
        if (!existingNoMatch) {
            const msg = document.createElement('div');
            msg.id = 'no-match-msg';
            msg.className = 'no-match-text';
            msg.innerText = ' 沒有符合目前篩選條件的單品豆';
            document.getElementById('singleGrid').appendChild(msg);
        }
    } else if (existingNoMatch) {
        existingNoMatch.remove();
    }
}

function initFilterEvents() {
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => {
        btn.addEventListener('click', function() {
            const parent = this.parentElement;
            parent.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');

            const type = this.getAttribute('data-type');
            const val = this.getAttribute('data-val');

            if (type === 'roast') currentRoastFilter = val;
            if (type === 'process') currentProcessFilter = val;

            applyFilters();
        });
    });
}

async function fetchMenu() {
    try {
        const response = await fetch(SPREADSHEET_CSV_URL + '&t=' + Date.now());
        if (!response.ok) throw new Error('CSV 讀取失敗');
        const text = await response.text();
        const rows = parseCSV(text);

        let classicHTML = '', otherHTML = '';
        let singleBeans = [];

        for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r[0] || !r[2]) continue;
            const type = r[0].trim();
            const name = r[2].trim();

            if (type === 'classic') {
                classicHTML += `
                    <div class="menu-item">
                        <span class="item-name">${name}</span>
                        <div class="item-line"></div>
                        <span class="item-price">${r[8] || '0'}</span>
                    </div>`;
            } else if (type === 'other') {
                otherHTML += `
                    <div class="menu-item">
                        <span class="item-name">${name}</span>
                        <div class="item-line"></div>
                        <span class="item-price">${r[8] || '0'}</span>
                    </div>`;
            } else if (type === 'single') {
                const status = (r[12] || '').trim();
                if (status !== '1' && status !== '上架') continue;

                singleBeans.push({
                    name: name,
                    origin: (r[3] || '').trim(),
                    process: (r[4] || '').trim(),
                    roast: (r[5] || 'lr').trim(),
                    roastName: (r[6] || '淺焙').trim(),
                    flavor: (r[7] || '').trim(),
                    pTakeout: parseFloat(r[8]) || 0,
                    pInhouse: r[9] || '-',
                    pBeans: r[10] || '-',
                    pDrip: r[11] || '-'
                });
            }
        }

        singleBeans.sort((a, b) => {
            const roastOrder = { 'lr': 1, 'mr': 2, 'dr': 3 };
            const aRoast = roastOrder[a.roast] || 99;
            const bRoast = roastOrder[b.roast] || 99;
            if (aRoast !== bRoast) return aRoast - bRoast;

            function getProcessWeight(p) {
                if (p.includes('日曬')) return 1;
                if (p.includes('水洗')) return 2;
                return 3;
            }
            const aProc = getProcessWeight(a.process);
            const bProc = getProcessWeight(b.process);
            if (aProc !== bProc) return aProc - bProc;

            return b.pTakeout - a.pTakeout;
        });

        let singleHTML = '';
        for (const b of singleBeans) {
            singleHTML += `
                <div class="card" data-roast="${b.roast}" data-process="${b.process}">
                    <div class="badge-row">
                        <span class="badge ${b.roast}">${b.roastName}</span>
                        ${b.process ? `<span class="badge process">${b.process}</span>` : ''}
                    </div>
                    <h3 class="theme-word">${b.name}</h3>
                    <div class="origin">${b.origin}</div>
                    <div class="flavor">${b.flavor || '風味內洽'}</div>
                    <div class="price-matrix">
                        <div class="price-box"><span class="p-label">外帶</span><span class="p-amount">${b.pTakeout || '-'}</span></div>
                        <div class="price-box"><span class="p-label">內用</span><span class="p-amount">${b.pInhouse}</span></div>
                        <div class="price-box"><span class="p-label">濾掛</span><span class="p-amount">${b.pDrip}</span></div>
                        <div class="price-box"><span class="p-label">半磅</span><span class="p-amount">${b.pBeans}</span></div>
                    </div>
                </div>`;
        }

        document.getElementById('classicList').innerHTML = classicHTML || '<div class="loading-text">暫無品項</div>';
        document.getElementById('otherList').innerHTML   = otherHTML   || '<div class="loading-text">暫無品項</div>';
        document.getElementById('singleGrid').innerHTML  = singleHTML  || '<div class="loading-text">目前無供應單品豆</div>';

        initFilterEvents();
        applyFilters();

    } catch (err) {
        console.error('選單載入失敗:', err);
        document.getElementById('classicList').innerHTML = '<div class="loading-text" style="color:red;">讀取失敗</div>';
        document.getElementById('otherList').innerHTML   = '<div class="loading-text" style="color:red;">讀取失敗</div>';
        document.getElementById('singleGrid').innerHTML  = '<div class="loading-text" style="color:red;">讀取失敗</div>';
    }
}

fetchMenu();
</script>
</body>
</html>
